# Redirección HTTP -> HTTPS
server {
  listen 80;
  server_name overcutf1.com;

  # Soporte para ACME challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl;
  http2 on;
  server_name overcutf1.com;

  # Certificados Let's Encrypt (se rellenan tras certbot)
  ssl_certificate     /etc/letsencrypt/live/overcutf1.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/overcutf1.com/privkey.pem;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # Seguridad básica
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # --- Frontend OverCut en raíz (/)
  root /usr/share/nginx/html/overcut;
  index index.html;

  # SPA fallback (OverCut)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- F1Hub frontend bajo /f1hub/
  # /f1hub/
location ^~ /f1hub/ {
  alias /usr/share/nginx/html/f1hub/;
  index index.html;
  try_files $uri $uri/ /index.html;   # <--- relativo al alias
}

# redirección sin barra
location = /overcuthub { return 301 /overcuthub/; }

# SPA en /overcuthub/
location ^~ /overcuthub/ {
  alias /usr/share/nginx/html/f1hub/;
  index index.html;
  try_files $uri $uri/ /index.html;
}

# redirección sin barra
location = /overcutPredictions { return 301 /overcutPredictions/; }

location ^~ /overcutPredictions/ {
  alias /usr/share/nginx/html/overcutPredictions/;
  index index.html;
  try_files $uri $uri/ /index.html;
}


  client_max_body_size 20m;

  # --- APIs (proxy a contenedores internos)
  # OverCut backend
  location /overcut/api/ {
    proxy_pass http://overcut-backend:8080/overcut/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header Authorization $http_authorization;
  }

  # F1Hub backend
  location /f1hub/api/ {
    proxy_pass http://f1hub-backend:8082/f1hub/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header Authorization     $http_authorization;
  }
  
  location /overcutPredictions/api/ {
  proxy_pass http://overcutpredictions-backend:8085/overcutPredictions/api/;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization     $http_authorization;
}


  # ACME challenge (renovación)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Gzip básico
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 256;
}

