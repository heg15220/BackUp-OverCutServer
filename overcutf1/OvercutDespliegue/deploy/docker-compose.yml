services:
  db:
    image: mysql:8.4
    container_name: db
    command:
      - "--max_allowed_packet=64M"
      - "--innodb_log_file_size=256M"
      - "--innodb_buffer_pool_size=4G"
      - "--innodb_buffer_pool_instances=4"
      - "--max_connections=400"
      - "--thread_cache_size=100"
      - "--table_open_cache=4000"
      - "--table_definition_cache=4000"
      - "--tmp_table_size=256M"
      - "--max_heap_table_size=256M"
      - "--innodb_flush_log_at_trx_commit=2"
      - "--sync_binlog=0"
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_F1DB_NAME: ${MYSQL_F1DB_NAME}
      MYSQL_OVERCUT_DB: ${MYSQL_OVERCUT_DB}
      MYSQL_F1HUB_DB: ${MYSQL_F1HUB_DB}
      MYSQL_FASTAPI_USER: ${MYSQL_FASTAPI_USER}
      MYSQL_FASTAPI_PASSWORD: ${MYSQL_FASTAPI_PASSWORD}
      MYSQL_OVERCUT_USER: ${MYSQL_OVERCUT_USER}
      MYSQL_OVERCUT_PASSWORD: ${MYSQL_OVERCUT_PASSWORD}
      MYSQL_F1HUB_USER: ${MYSQL_F1HUB_USER}
      MYSQL_F1HUB_PASSWORD: ${MYSQL_F1HUB_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [app-net]
    mem_limit: 5g
    cpus: "1.6"

  fastapi:
    build:
      context: ../overcut/src/main/resources/scripts/
    container_name: fastapi
    environment:
      TZ: ${TZ}
      DB_URI: ${FASTAPI_DB_URI}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_F1DB_NAME}
      PROJECT_ROOT: /app
      CACHE_DIR: /app_src_main
      CACHE_DATA_DIR: /app/resources/scripts/cache
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../overcut/src/main:/app_src_main:ro
      - ../overcut/src/main/resources/scripts:/app/resources/scripts:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks: [app-net]
    mem_limit: 1200m
    cpus: "0.8"

  overcut-backend:
    build:
      context: ..
      dockerfile: overcut/Dockerfile
    container_name: overcut-backend
    environment:
      TZ: ${TZ}
      SERVER_SERVLET_CONTEXT_PATH: /overcut
      SPRING_PROFILES_ACTIVE: prod

      # ✅ JVM controlada (evita que crezca sin techo)
      JAVA_TOOL_OPTIONS: >-
        -Xms512m -Xmx2304m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Dfile.encoding=UTF-8
        -Djava.security.egd=file:/dev/./urandom

      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_OVERCUT_DB}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_OVERCUT_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_OVERCUT_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_SQL_INIT_MODE: never
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: ""
      SPRING_SQL_INIT_DATA_LOCATIONS: classpath:data.sql
      SPRING_JPA_HIBERNATE_NAMING_PHYSICAL_STRATEGY: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      SPRING_JPA_HIBERNATE_NAMING_IMPLICIT_STRATEGY: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

      # ✅ FastAPI
      FASTAPI_BASE_URL: http://fastapi:8000

      # ✅ Mail / JWT
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      PROJECT_JWT_SIGNKEY: ${OVERCUT_JWT_SIGNKEY}
      PROJECT_JWT_EXP_MINUTES: ${OVERCUT_JWT_EXP_MINUTES}

      OVERCUT_ROSCOS_DIR: /app/src/main/resources/scripts
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 15MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 20MB

      # ✅ Tomcat preparado para picos (cola grande)
      SERVER_TOMCAT_THREADS_MAX: "300"
      SERVER_TOMCAT_ACCEPT_COUNT: "1000"
      SERVER_TOMCAT_CONNECTION_TIMEOUT: "20000"

      # ✅ Hikari (pool controlado)
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "30"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "20000"
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "600000"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1800000"

    depends_on:
      db:
        condition: service_healthy
      fastapi:
        condition: service_started
    volumes:
      - ../overcut/src/main/resources/scripts:/src/main/resources/scripts:ro
      - ../overcut/src/main/resources/scripts:/app/src/main/resources/scripts:ro
    networks: [app-net]
    expose:
      - "8080"
    restart: unless-stopped
    mem_limit: 3g
    cpus: "1.2"

  f1hub-backend:
    build:
      context: ..
      dockerfile: f1Hub/Dockerfile
    container_name: f1hub-backend
    environment:
      TZ: ${TZ}
      SERVER_SERVLET_CONTEXT_PATH: /f1hub
      SPRING_PROFILES_ACTIVE: prod

      JAVA_TOOL_OPTIONS: >-
        -Xms512m -Xmx3072m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Dfile.encoding=UTF-8
        -Djava.security.egd=file:/dev/./urandom

      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_F1DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_F1HUB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_F1HUB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_HIBERNATE_NAMING_PHYSICAL_STRATEGY: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      SPRING_JPA_HIBERNATE_NAMING_IMPLICIT_STRATEGY: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

      SERVER_TOMCAT_THREADS_MAX: "350"
      SERVER_TOMCAT_ACCEPT_COUNT: "1200"
      SERVER_TOMCAT_CONNECTION_TIMEOUT: "20000"

      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "40"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "20000"
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "600000"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1800000"

    depends_on:
      db:
        condition: service_healthy
    networks: [app-net]
    expose:
      - "8082"
    restart: unless-stopped
    mem_limit: 3500m
    cpus: "1.4"

  overcutpredictions-backend:
    build:
      context: ..
      dockerfile: overcutPredictions/Dockerfile
    container_name: overcutpredictions-backend
    environment:
      TZ: ${TZ}
      SERVER_SERVLET_CONTEXT_PATH: /overcutPredictions
      SPRING_PROFILES_ACTIVE: prod

      JAVA_TOOL_OPTIONS: >-
        -Xms256m -Xmx1536m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Dfile.encoding=UTF-8
        -Djava.security.egd=file:/dev/./urandom

      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_F1DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_F1HUB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_F1HUB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_HIBERNATE_NAMING_PHYSICAL_STRATEGY: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      SPRING_JPA_HIBERNATE_NAMING_IMPLICIT_STRATEGY: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

      SERVER_TOMCAT_THREADS_MAX: "200"
      SERVER_TOMCAT_ACCEPT_COUNT: "800"
      SERVER_TOMCAT_CONNECTION_TIMEOUT: "20000"

      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "25"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "3"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "20000"
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "600000"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1800000"

    depends_on:
      db:
        condition: service_healthy
    networks: [app-net]
    expose:
      - "8085"
    restart: unless-stopped
    mem_limit: 2g
    cpus: "0.9"

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    container_name: web
    depends_on:
      overcut-backend:
        condition: service_started
      f1hub-backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [app-net]
    restart: unless-stopped
    mem_limit: 600m
    cpus: "0.5"

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [app-net]
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.2"

volumes:
  certbot_conf:
  certbot_www:

networks:
  app-net:
    driver: bridge
